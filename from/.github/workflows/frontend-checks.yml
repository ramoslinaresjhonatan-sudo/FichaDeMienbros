name: Frontend checks

on:
  push:
    paths:
      - 'from/**'
  pull_request:
    paths:
      - 'from/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: from
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: from/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
